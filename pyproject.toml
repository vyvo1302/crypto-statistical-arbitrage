[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "crypto-statistical-arbitrage"
version = "1.0.0"
description = "Cryptocurrency Statistical Arbitrage System using PCA Factor Decomposition and Ornstein-Uhlenbeck Mean Reversion"
readme = "README.md"
authors = [{ name = "Thanh Vy Vo", email = "vothanhvy1302@gmail.com" }]
requires-python = ">=3.9"
dependencies = [
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "scikit-learn>=1.0.0",
    "matplotlib>=3.5.0",
    "tqdm>=4.60.0",
]

[project.scripts]
crypto-stat-arb = "src.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
